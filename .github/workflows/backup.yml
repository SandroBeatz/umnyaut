name: DB backup (weekly)

# Weekly pg_dump of umnyaut-prod while on the Supabase Free plan (no PITR).
# The dump is encrypted with BACKUP_PASSPHRASE before upload: the repo is public and
# artifacts of public repos can be downloaded by anyone. Moves to private storage in Phase 9 (A25).
# Runs once vars.BACKUP_ENABLED == 'true' and secrets SUPABASE_PROD_DB_URL, BACKUP_PASSPHRASE are set.
# Restore: gpg -d umnyaut-prod.dump.gpg > umnyaut-prod.dump && pg_restore -d "$DB_URL" --no-owner umnyaut-prod.dump

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-client-17
      - name: Dump and encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_PROD_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --file=umnyaut-prod.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output umnyaut-prod.dump.gpg umnyaut-prod.dump
          rm umnyaut-prod.dump
          ls -lh umnyaut-prod.dump.gpg
      - uses: actions/upload-artifact@v7
        with:
          name: umnyaut-prod-${{ github.run_id }}
          path: umnyaut-prod.dump.gpg
          retention-days: 35
          if-no-files-found: error
