name: Deploy

# main → GHCR image (SHA tag) → prod migrations → VPS blue/green swap → external smoke test.
# Migrations and the VPS steps run only once repo variables are set (see docs/deploy/environments-and-ci.md):
#   vars.SUPABASE_PROJECT_REF, vars.DEPLOY_HOST, vars.PROD_URL
# and secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
# There is one Supabase project (prod); local dev uses the Docker stack, staging/previews run without a DB.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: Roll back to the previous release instead of deploying
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sandrobeatz/umnyaut-web

jobs:
  image:
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:main
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    needs: image
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod-vps
    defaults:
      run:
        working-directory: packages/db
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
      - run: supabase db push

  deploy:
    needs: [image, migrate]
    if: ${{ always() && vars.DEPLOY_HOST != '' && (inputs.rollback || (needs.image.result == 'success' && needs.migrate.result != 'failure')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: prod-vps
      url: ${{ vars.PROD_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: SSH setup
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Sync infra files
        run: scp infra/compose.yml infra/Caddyfile infra/deploy.sh deploy@${{ vars.DEPLOY_HOST }}:/srv/umnyaut/
      - name: Deploy or roll back
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ "${{ inputs.rollback }}" = "true" ]; then
            ssh deploy@${{ vars.DEPLOY_HOST }} '/srv/umnyaut/deploy.sh rollback'
          else
            echo "$GHCR_TOKEN" | ssh deploy@${{ vars.DEPLOY_HOST }} \
              "docker login ghcr.io -u ${{ github.actor }} --password-stdin && /srv/umnyaut/deploy.sh deploy $TAG; rc=\$?; docker logout ghcr.io; exit \$rc"
          fi
      - name: External smoke test
        if: ${{ !inputs.rollback }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 "${{ vars.PROD_URL }}/api/health/" | tee /dev/stderr \
            | grep -q '"version":"${{ needs.image.outputs.tag }}"'
          curl -fsS "${{ vars.PROD_URL }}/" | grep -qE '<h1[ >]'
